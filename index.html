<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Admin Panel</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
    body{background:linear-gradient(160deg,#0f172a,#1e1b4b,#0b1120);color:#e2e8f0;min-height:100vh;padding:16px}
    .container{max-width:560px;margin:0 auto}
    .header{text-align:center;padding:18px 0 24px}
    .header h1{font-size:1.8rem;font-weight:800;background:linear-gradient(90deg,#22d3ee,#a78bfa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
    .header p{color:#94a3b8;font-size:.9rem}
    .card{background:rgba(30,41,59,.95);border-radius:20px;padding:20px;margin-bottom:16px;border:1px solid rgba(99,102,241,.25)}
    .card h2{font-size:1.1rem;margin-bottom:14px}
    label{display:block;font-size:.85rem;color:#94a3b8;margin-bottom:6px}
    input,select{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #475569;background:#0f172a;color:#f1f5f9;font-size:1rem;margin-bottom:12px;outline:none}
    .btn{width:100%;padding:13px;border:none;border-radius:12px;font-weight:700;cursor:pointer;margin-top:4px}
    .btn-primary{background:linear-gradient(135deg,#06b6d4,#6366f1);color:#fff}
    .btn-success{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
    .btn-danger{background:#ef4444;color:#fff}
    .btn-warning{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
    .btn-sm{width:auto;padding:7px 12px;font-size:.8rem;border-radius:8px}
    .message{margin-top:12px;padding:12px;border-radius:10px;text-align:center;display:none;font-size:.9rem}
    .message.show{display:block}
    .message.success{background:rgba(16,185,129,.15);border:1px solid #10b981;color:#6ee7b7}
    .message.error{background:rgba(239,68,68,.15);border:1px solid #ef4444;color:#fca5a5}
    .list-item{display:flex;justify-content:space-between;gap:10px;background:#0f172a;padding:12px;border-radius:12px;margin-bottom:10px;border:1px solid #334155}
    .list-item .title{font-weight:700;word-break:break-all}
    .list-item .sub{font-size:.85rem;color:#94a3b8;word-break:break-all}
    .list-item .meta{font-size:.75rem;color:#64748b;margin-top:4px}
    .history-item{background:#0f172a;border:1px solid #334155;border-radius:12px;padding:14px;margin-bottom:10px}
    .history-header{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:8px;font-size:.85rem}
    .history-header .key{color:#38bdf8;font-weight:700;font-family:monospace}
    .history-header .time{color:#94a3b8}
    .tag{display:inline-block;background:#334155;padding:5px 10px;border-radius:20px;font-size:.8rem;margin:2px 4px 2px 0}
    .empty,.loading{text-align:center;color:#64748b;padding:20px}
    .section-title{font-size:.78rem;color:#64748b;margin:12px 0 8px;text-transform:uppercase}
    .pin-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
    .pin-row .btn{margin:0 0 12px 0;width:auto;padding:13px 16px}
    .top-actions{display:flex;gap:8px;margin-bottom:10px}
    .top-actions .btn{margin:0}
    .footer{text-align:center;margin-top:18px;color:#64748b;font-size:.8rem}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Admin Panel</h1>
      <p>Keys • Boxes • PIN • Live History</p>
    </div>

    <div class="card">
      <h2>🔒 Delete PIN</h2>
      <label>PIN (min 4 chars)</label>
      <div class="pin-row">
        <input type="text" id="deletePin" placeholder="1234">
        <button class="btn btn-warning" onclick="setDeletePin()">Set PIN</button>
      </div>
      <div id="pinMessage" class="message"></div>
    </div>

    <div class="card">
      <h2>🔑 License Keys</h2>
      <label>Naya Key</label>
      <input type="text" id="newKey" placeholder="VIP-2026">
      <button class="btn btn-primary" onclick="addLicenseKey()">Key Add Karo</button>
      <div id="keyAddMessage" class="message"></div>
      <div class="section-title">All Keys</div>
      <div id="keysList"><div class="loading">Loading...</div></div>
    </div>

    <div class="card">
      <h2>📦 Boxes</h2>
      <label>Key select karo</label>
      <select id="selectedKeyForBox"><option value="">-- Select --</option></select>
      <label>Line 1</label>
      <input type="text" id="line1" placeholder="Line 1">
      <label>Line 2</label>
      <input type="text" id="line2" placeholder="Line 2">
      <button class="btn btn-success" onclick="addBoxForKey()">Box Add Karo</button>
      <div id="boxAddMessage" class="message"></div>
      <div id="boxesForKeyList"></div>
    </div>

    <div class="card">
      <h2>📋 Live Submissions</h2>
      <div class="top-actions">
        <button class="btn btn-primary" onclick="loadHistory()">Refresh Now</button>
      </div>
      <div id="historyList"><div class="loading">Loading history...</div></div>
      <button class="btn btn-danger" style="margin-top:10px" onclick="clearHistory()">Clear All History</button>
    </div>

    <p class="footer">© 2026 License Key System • Auto refresh ON</p>
  </div>

  <script>
    const WORKER_URL = "https://fhdjsf.rakamare248.workers.dev";

    function showMsg(el, text, type) {
      el.innerHTML = text;
      el.className = "message show " + type;
      setTimeout(() => el.classList.remove("show"), 4000);
    }

    function formatDateTime(ts) {
      if (!ts) return "—";
      const d = new Date(ts);
      return d.toLocaleDateString("hi-IN") + " • " + d.toLocaleTimeString("hi-IN", { hour: "2-digit", minute: "2-digit" });
    }

    function escapeHtml(t) {
      const d = document.createElement("div");
      d.textContent = t || "";
      return d.innerHTML;
    }

    async function setDeletePin() {
      const pin = document.getElementById("deletePin").value.trim();
      const msg = document.getElementById("pinMessage");
      if (!pin || pin.length < 4) return showMsg(msg, "PIN min 4 characters", "error");
      try {
        const res = await fetch(`${WORKER_URL}/api/set-delete-pin`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pin })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById("deletePin").value = "";
          showMsg(msg, "PIN set successfully!", "success");
        } else showMsg(msg, data.message || "Failed", "error");
      } catch { showMsg(msg, "Network error", "error"); }
    }

    async function addLicenseKey() {
      const key = document.getElementById("newKey").value.trim().toUpperCase();
      const msg = document.getElementById("keyAddMessage");
      if (!key) return showMsg(msg, "Key likho!", "error");
      try {
        const res = await fetch(`${WORKER_URL}/api/add-key`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ key })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById("newKey").value = "";
          showMsg(msg, key + " add ho gaya!", "success");
          loadKeys();
        } else showMsg(msg, data.message || "Failed", "error");
      } catch { showMsg(msg, "Network error", "error"); }
    }

    async function deleteKey(key) {
      if (!confirm(`Delete key ${key}?`)) return;
      await fetch(`${WORKER_URL}/api/delete-key`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key })
      });
      loadKeys();
    }

    async function loadKeys() {
      const list = document.getElementById("keysList");
      const select = document.getElementById("selectedKeyForBox");
      try {
        const res = await fetch(`${WORKER_URL}/api/get-keys`);
        const data = await res.json();
        const keys = data.keys || [];
        list.innerHTML = keys.length ? keys.map(k => `
          <div class="list-item">
            <div><div class="title" style="font-family:monospace">${k}</div></div>
            <button class="btn btn-danger btn-sm" onclick="deleteKey('${k}')">Delete</button>
          </div>`).join("") : '<div class="empty">No keys</div>';

        select.innerHTML = '<option value="">-- Select --</option>' + keys.map(k => `<option value="${k}">${k}</option>`).join("");
        select.onchange = () => loadBoxesForSelectedKey(select.value);
      } catch {
        list.innerHTML = '<div class="empty">Error loading keys</div>';
      }
    }

    async function addBoxForKey() {
      const key = document.getElementById("selectedKeyForBox").value;
      const line1 = document.getElementById("line1").value.trim();
      const line2 = document.getElementById("line2").value.trim();
      const msg = document.getElementById("boxAddMessage");
      if (!key) return showMsg(msg, "Key select karo", "error");
      if (!line1 || !line2) return showMsg(msg, "Dono lines bharo", "error");
      try {
        const res = await fetch(`${WORKER_URL}/api/add-box`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ key, line1, line2 })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById("line1").value = "";
          document.getElementById("line2").value = "";
          showMsg(msg, "Box added!", "success");
          loadBoxesForSelectedKey(key);
        } else showMsg(msg, data.message || "Failed", "error");
      } catch { showMsg(msg, "Network error", "error"); }
    }

    async function deleteBox(key, boxId) {
      if (!confirm("Delete this box?")) return;
      await fetch(`${WORKER_URL}/api/delete-box`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key, boxId })
      });
      loadBoxesForSelectedKey(key);
    }

    async function loadBoxesForSelectedKey(key) {
      const list = document.getElementById("boxesForKeyList");
      if (!key) { list.innerHTML = ""; return; }
      list.innerHTML = '<div class="loading">Loading boxes...</div>';
      try {
        const res = await fetch(`${WORKER_URL}/api/get-boxes-admin`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ key })
        });
        const data = await res.json();
        const boxes = data.boxes || {};
        const ids = Object.keys(boxes).sort((a,b)=>(boxes[b].createdAt||0)-(boxes[a].createdAt||0));
        if (!ids.length) {
          list.innerHTML = `<div class="empty">No boxes for ${key}</div>`;
          return;
        }
        list.innerHTML = `<div class="section-title">Boxes for ${key}</div>` + ids.map(id => {
          const box = boxes[id];
          return `<div class="list-item">
            <div>
              <div class="title">${escapeHtml(box.line1)}</div>
              <div class="sub">${escapeHtml(box.line2)}</div>
              <div class="meta">Added: ${formatDateTime(box.createdAt)}</div>
            </div>
            <button class="btn btn-danger btn-sm" onclick="deleteBox('${key}','${id}')">Delete</button>
          </div>`;
        }).join("");
      } catch {
        list.innerHTML = '<div class="empty">Error</div>';
      }
    }

    async function loadHistory() {
      const list = document.getElementById("historyList");
      try {
        const res = await fetch(`${WORKER_URL}/api/get-history`);
        const data = await res.json();
        const submissions = data.submissions || {};
        const items = Object.keys(submissions).map(id => ({ id, ...submissions[id] }));
        items.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));

        if (!items.length) {
          list.innerHTML = '<div class="empty">Abhi koi booking nahi aayi</div>';
          return;
        }

        list.innerHTML = items.map(item => `
          <div class="history-item">
            <div class="history-header">
              <span class="key">🔑 ${escapeHtml(item.key || "-")}</span>
              <span class="time">📅 ${escapeHtml(item.date || "-")} 🕒 ${escapeHtml(item.time || "-")}</span>
            </div>
            <div>${(item.items || []).map(i => `<span class="tag">${escapeHtml(i)}</span>`).join("")}</div>
          </div>
        `).join("");
      } catch {
        list.innerHTML = '<div class="empty">History load error</div>';
      }
    }

    async function clearHistory() {
      if (!confirm("Clear all history?")) return;
      await fetch(`${WORKER_URL}/api/clear-history`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({})
      });
      loadHistory();
    }

    // Init + auto refresh every 5 sec
    loadKeys();
    loadHistory();
    setInterval(loadHistory, 5000);
  </script>
</body>
</html>
